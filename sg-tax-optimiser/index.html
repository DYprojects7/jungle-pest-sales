<!doctype html>
<html lang="en-SG">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Singapore Tax Optimiser</title>
    <meta
      name="description"
      content="How much to put into SRS and CPF cash top-ups before 31 December to cut your Singapore income tax, and where putting in more stops paying off."
    />
    <meta name="theme-color" content="#f3f5fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
    <!-- The brand mark (three steps down) as the tab icon, inline so the file stays self-contained and a hosted
         copy is never asked for /favicon.ico. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111a40'/%3E%3Crect x='6' y='6' width='6' height='20' fill='%238fa3ff'/%3E%3Crect x='13' y='13' width='6' height='13' fill='%238fa3ff'/%3E%3Crect x='20.75' y='19.75' width='4.5' height='5.5' fill='none' stroke='%23f4f6fd' stroke-width='1.5'/%3E%3C/svg%3E"
    />
    <!-- No font <link> here on purpose: src/web/fonts.ts adds the Google Fonts stylesheet after the page has
         loaded, so a slow or blocked fonts host can never hold up the calculator. -->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
